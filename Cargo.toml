[package]
name = "rem-capture"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-uniform-type-identifiers"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
